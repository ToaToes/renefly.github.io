<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>航班搜索结果</title>
  <link rel="stylesheet" href="progress_bar.css">
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #f9f9fb;
      margin: 0;
      padding: 30px;
      color: #333;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
    }

    .selection-summary {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: 20px auto;
    }

    .selection-summary h3 {
      margin-bottom: 10px;
    }

    .selection-summary ul {
      list-style: none;
      padding: 0;
    }

    .selection-summary li {
      margin-bottom: 8px;
      font-size: 16px;
    }

    .results-container {
      text-align: center;
      margin-top: 40px;
      color: #777;
      font-size: 18px;
    }

    .mild {
      font-weight: 600; /* semibold (between normal and strong) */
      color: #333;
    }
  </style>

  <style> </style>
  <script src="mapping.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>

  <script>

      apiKey: "AIzaSyBjBXmXps-wu6qIudSdD_0aGNri6WiM3vU",
      authDomain: "loginauth-8662e.firebaseapp.com",
      projectId: "loginauth-8662e",
      storageBucket: "loginauth-8662e.firebasestorage.app",
      messagingSenderId: "542087917375",
      appId: "1:542087917375:web:deb096e402681ac4756d8a",
      measurementId: "G-DK6XZBH36G"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ! Force no session persistence (always ask login)
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
      .then(() => {
        console.log("Persistence set to NONE (in-memory only)");
      })
      .catch((error) => {
        console.error("Failed to set persistence:", error);
    });

    // Protect this page
    auth.onAuthStateChanged(user => {

        window.location.href = "index.html";
      } else {

        alert("You cannot enter this page directly.");

      }

    });
  </script>
</head>

<body>

  <!-- Auth blocker element -->
  <div id="auth-blocker" style="display: block;"></div>

  <h2>航班搜索结果</h2>

  <div class="selection-summary">
    <h3>您的搜索条件：</h3>
    <ul id="selectionList"></ul>
  </div>

  
  <!-- For every airlines -->
  <div id="progress-bars"></div>

  <!-- Placeholder for backend flight results -->
  <div class="results-container" id="results"></div>


  <script>
    // helper func
    function mapCabinClass(raw) {
      if (!raw) return "—";

      // Split by comma, trim, map each part
      const classes = raw.split(",").map(c => {
        const key = c.trim().toLowerCase().replace(/[-\s]/g, "_");
        return CLASS_MAP[key] || c.trim();
      });

      // Join back as readable string
      return classes.join(", ");
    }

  </script>

  <script>
    // Helper to get flight_result from sessionStorage
    function getFlightResult() {
      const raw = sessionStorage.getItem("flight_result");
      if (!raw) return null;
      
      if (raw === "__PENDING__") {
        return { status: "pending", downstream: [] }; // treat pending as object
      }

      try {
        return JSON.parse(raw);
      } catch (e) {
        console.warn("Invalid flight_result JSON:", raw);
        return { status: "pending", downstream: [] };
      }
    }

  </script>

  <script>
    // Parse URL parameters
    const params = new URLSearchParams(window.location.search);
    // Get stored UUID
    let uuid = sessionStorage.getItem("flight_uuid");

    // Helper to safely get value or default
    const getValue = (key, fallback = "未选择") => {
      const val = params.get(key);
      return val ? decodeURIComponent(val) : fallback;
    };

    // Prepare displayed data
    const selectionData = {
      "日期": getValue("flightDate"),
      "出发地": getValue("departure"),
      "到达地": getValue("arrival"),
      
      // multiple values support
      "舱等": (() => {
        const classes = params.getAll("class").map(cls => CLASS_MAP[cls] || cls);
        return classes.length > 0 ? classes.join(", ") : "全部";
      })(),

      "航司": (() => {
        const airlines = params.getAll("airline").map(a => AIRLINE_MAP[a] || a);
        return airlines.length > 0 ? airlines.join(", ") : "全部";
      })(),

      "直飞": params.get("directFlight") ? "是" : "否"
    };

    // Render selection summary
    const list = document.getElementById("selectionList");
    for (const [label, value] of Object.entries(selectionData)) {
      const li = document.createElement("li");
      li.textContent = `${label}: ${value}`;
      list.appendChild(li);
    }


    // --- Progress state ---

    // Fallback to URL param if needed
    if (!uuid) {
        uuid = params.get("uuid");  // if you passed ?uuid=xxx
    }

    if (!uuid) {
      alert("Invalid entry");
      location.href = "search.html";
    }

    // const ws = new WebSocket(`wss://jp.renefly.com/ws/flights/${uuid}`);

    const progressState = {};
    const airlineResults = {};

    const expectedAirlines = params.getAll("airline");
    expectedAirlines.forEach(a => { progressState[a] = { done:false, status:"loading" }; });

    // helper func
    function renderProgressFromStorage() {

      const data = getFlightResult();
      if (!data) return;

      const downstream = Array.isArray(data.downstream) ? data.downstream : [];

      downstream.forEach(item => {
        const airline = item?.results?.airline;
        if (!airline) return;
        progressState[airline] = { done: true, status: item.status };
      });

      renderProgressBars();
    }

    // renderProgressFromStorage();

    function renderProgressBars() {
      const container = document.getElementById("progress-bars");
      if (!container) return;
      let html = "";
      Object.entries(progressState).forEach(([airline, info]) => {
        const pct = info.done ? 100 : 30;
        html += `
          <div class="progress-row">
            <div class="progress-label">${AIRLINE_MAP[airline]||airline}</div>
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-status">${info.done ? "完成" : "加载中..."}</div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // Debug: show backend payloads in console
    function logBackendPayloads() {
      const raw = sessionStorage.getItem("flight_result");

      console.group("Backend → Frontend payload (from sessionStorage)");

      if (!raw) {
        console.warn("flight_result not found");
        console.groupEnd();
        return;
      }

      console.log("Raw flight_result:", raw);

      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        console.error("JSON parse failed", e);
        console.groupEnd();
        return;
      }

      console.log("Parsed flight_result object:", parsed);

      if (Array.isArray(parsed.downstream)) {
        parsed.downstream.forEach((item, idx) => {
          console.group(`Downstream[${idx}]`);
          console.log(item);
          console.groupEnd();
        });
      } else {
        console.warn("No downstream array found");
      }

      console.groupEnd();
    }


    // Call it once on page load
    logBackendPayloads();

    // Optional: keep logging as results update, check every 5 seconds
    setInterval(logBackendPayloads, 5000);


    // ----------------------------------------------------------
    // ADDED — load API results from sessionStorage
    // ----------------------------------------------------------

    function render(){
      const resultContainer = document.getElementById("results");
      const stored = getFlightResult();

      if (!stored || stored.status === "pending") {
        resultContainer.innerHTML = "<p>航班搜索仍在进行中...</p>";
        return;
      }

      if (stored.status === "no_ticket") {
        resultContainer.innerHTML = "<p>目前没有票</p>";
        return;
      }

      const downstream = Array.isArray(stored.downstream) ? stored.downstream : [];
      // Collect all flights from all successful airlines
      const allFlights = [];
      // store meta info per airline
      const metaMap = {};

      downstream.forEach(item => {
        if (item.status === "success" && Array.isArray(item.flights)) {
          allFlights.push(...item.flights);
          metaMap[item.results.airline] = item.results;
        }
      });

      if (allFlights.length === 0) {
        resultContainer.innerHTML = "<p>没有找到符合条件的航班。</p>";
        return;
      } 

      // Group flights by airline
      const grouped = {};
      allFlights.forEach(f => {
        const airlineCode = f.flight_no?.slice(0, 2) || metaMap[f.airline]?.airline || "未知航司";
        (grouped[airlineCode] ||= []).push(f);
      });

      // Render results in a simple readable format
      let html = `<h3>共找到 ${allFlights.length} 个航班：</h3>`;

      for (const airlineCode in grouped) {
        const airlineName = AIRLINE_MAP[airlineCode] || airlineCode;
        const meta = metaMap[airlineCode] || {};

        html += `
          <h2 style="
            margin-top:40px;
            color:#2c3e50;
            border-left:5px solid #3498db;
            padding-left:10px;
          ">${airlineName}</h2>
          <ul style="list-style:none; padding:0;">
        `;

        grouped[airlineCode].forEach(flight => {
          
          // Only show redeemable tickets
          if (!flight.can_redeem) return;

          html += `
            <li style="
              background:#fff;
              margin:14px auto;
              padding:16px;
              max-width:600px;
              border-radius:10px;
              box-shadow:0 2px 6px rgba(0,0,0,0.1);
              text-align:left;
            ">
              <strong>航班号：${flight.flight_no}</strong><br/>
              日期：${meta.depart_date || "—"}<br/>
              出发机场：${flight.origin}<br/>
              出发时间：${flight.depart_time || "—"}<br>
              到达机场：${flight.destination}<br/>
              到达时间：${flight.arrival_time || "—"}<br/>
              舱等：${mapCabinClass(meta.cabin_class)}<br/>
              中转次数：${flight.stop}<br/>
              中转机场：${flight.stop_airports || "—"}<br/>
              是否可兑换：${flight.can_redeem ? "是" : "否"}<br/>
              <strong>价格：${flight.miles} 元</strong>
            </li>
          `;
        });

        html += `</ul>`;
        
      }

      resultContainer.innerHTML = html;

    }

    // --- Live loop to update progress bars & results ---
    function liveRenderLoop() {
        renderProgressFromStorage();
        render();
    }

    liveRenderLoop();           // initial render
    setInterval(liveRenderLoop, 1000);  // auto-update every second

  </script>
  
</body>
</html>
