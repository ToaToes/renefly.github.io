<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加载中...</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f5f6fa;
      font-family: Arial, sans-serif;
    }

    .spinner {
      border: 6px solid #ddd;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    p {
      margin-top: 20px;
      color: #333;
      font-size: 18px;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>


  <script>

    // Define expected airlines
    const params = new URLSearchParams(window.location.search);
    const expectedAirlines = params.getAll("airline");
    const finishedAirlines = new Set();


    const firebaseConfig = {
      apiKey: "AIzaSyBjBXmXps-wu6qIudSdD_0aGNri6WiM3vU",
      authDomain: "loginauth-8662e.firebaseapp.com",
      projectId: "loginauth-8662e",
      storageBucket: "loginauth-8662e.firebasestorage.app",
      messagingSenderId: "542087917375",
      appId: "1:542087917375:web:deb096e402681ac4756d8a",
      measurementId: "G-DK6XZBH36G"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ! Force no session persistence (always ask login)
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
      .then(() => {
        console.log("Persistence set to NONE (in-memory only)");
      })
      .catch((error) => {
        console.error("Failed to set persistence:", error);
    });

    // ------------------------------
    // Prevent duplicate backend request on reload
    // ------------------------------
    const flightResult = sessionStorage.getItem("flight_result");

    if (flightResult && flightResult !== "__PENDING__") {
        // Request is still in progress, stay on loading page
        console.log("Results already exist -> redirecting");
        window.location.href = "results.html" + window.location.search;
    }


    // Protect this page
    auth.onAuthStateChanged(async (user) => {

      // User not logged in 
      if (!user || !user.emailVerified) {
        window.location.href = "index.html";
      } else {
        document.getElementById("auth-blocker").style.display = "none"; // hide blocker
      }

      // Read payload AFTER user is verified
      const payloadStr = sessionStorage.getItem("flight_payload");
      if (!payloadStr) {
          alert("Invalid entry");
          window.location.href = "search.html";
          return;
      }
      
      // MUST HAVE: flight payload from search.html
      if (sessionStorage.getItem("flight_result") === "__PENDING__") {
          console.log("Request already running, waiting for WebSocket ...");
          return;
      }


      const payload = JSON.parse(payloadStr);

      // Fetch ID token
      let idToken;
      try {
          idToken = await user.getIdToken(true);
      } catch (e) {
          console.error("Token error", e);
          alert("Auth error");
          return;
      }


      // ------------------------------
      // DEBUG: Log outgoing request headers + body
      // ------------------------------
      console.log(">>> Preparing to send backend request <<<");
      console.log("Endpoint:", "https://jp.renefly.com/search");

      console.log("Headers that will be sent:");
      console.log("Content-Type:", "application/json");
      console.log("Authorization:", "Bearer " + idToken.trim());

      console.log("Payload being sent:");
      console.log(payload);

      // -----------------------------------
      // Mark request as in-progress
      // -----------------------------------
      sessionStorage.setItem("flight_result", "__PENDING__");


      // SEND REQUEST HERE
      const res = await fetch("https://jp.renefly.com/search",{
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + idToken
        },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      const uuid = data.request_uuid;
      sessionStorage.setItem("flight_uuid", uuid);

      // WebSocket connection
      const ws = new WebSocket(`wss://jp.renefly.com/ws/flights/${uuid}`)

      const resultStore = {
        status: "pending",
        downstream: []   // matches results.html
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        console.log("WS RX:", msg);

        const airline = msg?.results?.airline;
        if (!airline) return;

        // Avoid duplicates
        if (finishedAirlines.has(airline)) return;

        finishedAirlines.add(airline);
        resultStore.downstream.push(msg);

        // airline result
        sessionStorage.setItem("flight_result", JSON.stringify(resultStore));

        // Check if all airlines finished
        if (finishedAirlines.size === expectedAirlines.length) {
          resultStore.status = "done";
          sessionStorage.setItem("flight_result", JSON.stringify(resultStore));
          ws.close();

          window.location.href = "results.html" + window.location.search;
        }

      };

      ws.onerror = () => {
        resultStore.status = "error";
        sessionStorage.setItem("flight_result", JSON.stringify(resultStore));
        alert("WebSocket connection failed");
      };

    });

  </script>
</head>
<body>
  <!-- Auth blocker element -->
  <div id="auth-blocker" style="display: block;"></div>

  <div class="spinner"></div>
  <p>正在加载航班信息，请稍候...</p>
  
</body>
</html>
