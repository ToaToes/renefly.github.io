<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加载中...</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f5f6fa;
      font-family: Arial, sans-serif;
    }

    .spinner {
      border: 6px solid #ddd;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    p {
      margin-top: 20px;
      color: #333;
      font-size: 18px;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>


  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBjBXmXps-wu6qIudSdD_0aGNri6WiM3vU",
      authDomain: "loginauth-8662e.firebaseapp.com",
      projectId: "loginauth-8662e",
      storageBucket: "loginauth-8662e.firebasestorage.app",
      messagingSenderId: "542087917375",
      appId: "1:542087917375:web:deb096e402681ac4756d8a",
      measurementId: "G-DK6XZBH36G"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ! Force no session persistence (always ask login)
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
      .then(() => {
        console.log("Persistence set to NONE (in-memory only)");
      })
      .catch((error) => {
        console.error("Failed to set persistence:", error);
    });

    // Protect this page
    auth.onAuthStateChanged(async (user) => {

      // User not logged in 
      if (!user || !user.emailVerified) {
        window.location.href = "index.html";
      } else {
        document.getElementById("auth-blocker").style.display = "none"; // hide blocker
      }

      
      // MUST HAVE: flight payload from search.html
      if (!sessionStorage.getItem("flight_payload")) {
          alert("You cannot access this page directly.");
          window.location.href = "search.html";
          return;
      }

      // Read payload AFTER user is verified
      const payloadStr = sessionStorage.getItem("flight_payload");
      if (!payloadStr) {
          alert("Error: No payload found.");
          return;
      }

      const payload = JSON.parse(payloadStr);

      // Fetch ID token
      let idToken;
      try {
          idToken = await user.getIdToken(true);
      } catch (e) {
          console.error("Token error", e);
          alert("Auth error");
          return;
      }


      // ------------------------------
      // DEBUG: Log outgoing request headers + body
      // ------------------------------
      console.log(">>> Preparing to send backend request <<<");
      console.log("Endpoint:", "http://192.168.1.81:8001/search");

      console.log("Headers that will be sent:");
      console.log("Content-Type:", "application/json");
      console.log("Authorization:", "Bearer " + idToken.trim());

      console.log("Payload being sent:");
      console.log(payload);

      
      // SEND REQUEST HERE
      let apiResult;
      try {
          const response = await fetch("https://jp.renefly.com/search", {
              method: "POST",
              headers: {
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + idToken.trim()
              },
              credentials: "include",
              body: JSON.stringify(payload)
          });

          // DEBUG: Log response info
          console.log(">>> Backend responded <<<");
          console.log("Status:", response.status);
          console.log("Response Headers:", Object.fromEntries(response.headers.entries()));

          apiResult = await response.json();

          console.log("Response JSON:", apiResult);

      } catch (err) {
          console.error("Backend error:", err);
          alert("Backend request failed.");
          return;
      }

      // Save to sessionStorage
      sessionStorage.setItem("flight_result", JSON.stringify(apiResult));

      // keep original params
      const params = window.location.search;

      // simulate loading, then go to results.html
      /*
      setTimeout(() => {
        
      }, 20000);
      */
      window.location.href = "results.html" + params;
    });

  </script>
</head>
<body>
  <!-- Auth blocker element -->
  <div id="auth-blocker" style="display: block;"></div>

  <div class="spinner"></div>
  <p>正在加载航班信息，请稍候...</p>
  
</body>
</html>
