<!DOCTYPE html>
<html>
<head>
    <title>Flight Search Demo</title>
</head>
<body>
    <h2>Search Flights</h2>

    <label>Date:</label>
    <input type="date" id="date"><br><br>

    <label>Airline:</label>
    <input type="text" id="airline"><br><br>

    <label>Origin:</label>
    <input type="text" id="origin"><br><br>

    <label>Destination:</label>
    <input type="text" id="destination"><br><br>

    <label>Class:</label>
    <input type="text" id="cabin_class"><br><br>

    <button onclick="search()">Search</button>

    <pre id="result"></pre>

<script>
async function search() {
    const payload = {
        date: document.getElementById("date").value,
        origin: document.getElementById("origin").value,
        destination: document.getElementById("destination").value,
        airline: document.getElementById("airline").value,
        cabin_class: document.getElementById("cabin_class").value,
    };

    try {
        const response = await fetch("http://127.0.0.1:8001/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        // Clear previous results
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = "";

        if (data.status === "success" && data.results.length > 0) {
            data.results.forEach(flight => {
                const flightInfo = `
                    <div style="border:1px solid #ccc; padding:10px; margin:10px 0;">
                        <strong>Airline:</strong> ${flight.airline}<br>
                        <strong>FlightNumber:</strong> ${flight.flight_no}<br>
                        <strong>From:</strong> ${flight.origin}<br>
                        <strong>To:</strong> ${flight.destination}<br>
                        <strong>Date:</strong> ${flight.date}<br>
                        <strong>Class:</strong> ${flight.class}<br>
                        <strong>Price:</strong> $${flight.price}<br>
                        <strong>DirectFlight:</strong> $${flight.DirectFlight}<br>
                    </div>
                `;
                resultDiv.innerHTML += flightInfo;
            });
        } else {
            resultDiv.textContent = "No flights found.";
        }

    } catch (error) {
        document.getElementById("result").textContent = "Error: " + error;
    }


}
</script>

</body>
</html>
